<!doctype html>
<html lang=pt>
<head>
<meta charset=UTF-8>
<meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no">
<title>BotQL Web</title>
<link rel=stylesheet href="app.css?v=19">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8B0000">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div id=statusbar>
<button id=btn-abrir-sidebar onclick=abrirSidebar() aria-label=Ficheiros>
<svg viewBox="0 0 24 24" fill=none><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" fill=#fff /></svg>
</button>
<span class=title id=titulo-statusbar>BotQL</span>
<button id=btn-doc onclick=abrirDocumentacao() aria-label=Documentação>
<svg viewBox="0 0 24 24" fill=none><circle cx=12 cy=12 r=10 stroke=#fff stroke-width=2 /><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.5v.4" stroke=#fff stroke-width=2 stroke-linecap=round /><circle cx=12 cy=17 r=1 fill=#fff /></svg>
</button>
<button id=btn-menu onclick=abrirMenu() aria-label=Menu>
<svg viewBox="0 0 24 24" fill=none><path d="M4 7h16M4 12h16M4 17h16" stroke=#fff stroke-width=2 stroke-linecap=round /></svg>
</button>
</div>
<div id=editor-wrap>
<pre id=editor-pre></pre>
<textarea id=editor-area spellcheck=false autocorrect=off autocapitalize=off autocomplete=off wrap=soft></textarea>
</div>
<div id=toolbar-atalhos>
<div id=atalhos-scroll></div>
<button id=btn-run onclick=runBot()>Run</button>
</div>
<div id=sidebar-overlay onclick=fecharSidebar()></div>
<div id=sidebar>
<div id=sidebar-cabecalho>
Ficheiros
<button id=btn-fechar-sidebar onclick=fecharSidebar()>
<svg viewBox="0 0 24 24" fill=none><path d="M18 6L6 18M6 6l12 12" stroke=#fff stroke-width=2 stroke-linecap=round /></svg>
</button>
</div>
<div id=sidebar-seccao>
<div class=sidebar-rotulo>Meus Bots</div>
<div id=lista-bots></div>
</div>
<div id=sidebar-rodape>
<button onclick=mostrarNovoBot()>+ Novo bot</button>
<button class=secundario onclick=mostrarNovoFicheiro()>+ Novo ficheiro (.txt)</button>
<button class=secundario onclick=carregarFicheiro()>Carregar ficheiro</button>
<button class=secundario onclick=exportarFicheiroAtual()>Exportar ficheiro</button>
</div>
</div>
<div id=menu-overlay>
<div id=menu-caixa>
<div id=menu-cabecalho>
Menu
<button id=btn-fechar-menu onclick=fecharMenu()>
<svg viewBox="0 0 24 24" fill=none><path d="M18 6L6 18M6 6l12 12" stroke=#fff stroke-width=2 stroke-linecap=round /></svg>
</button>
</div>
<div id=menu-lista>
<button onclick=abrirMeusBots()>
<span class=menu-icone><svg viewBox="0 0 24 24" fill=none><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke=#7A6A5E stroke-width=2 stroke-linecap=round /></svg></span>
Meus bots
</button>
<button onclick=abrirPartilharBot()>
<span class=menu-icone><svg viewBox="0 0 24 24" fill=none><circle cx=6 cy=12 r=2.5 stroke=#7A6A5E stroke-width=2 /><circle cx=18 cy=6 r=2.5 stroke=#7A6A5E stroke-width=2 /><circle cx=18 cy=18 r=2.5 stroke=#7A6A5E stroke-width=2 /><path d="M8.2 10.8L15.8 7.2M8.2 13.2l7.6 3.6" stroke=#7A6A5E stroke-width=2 /></svg></span>
Partilhar Bot
</button>
<button onclick=abrirModelos()>
<span class=menu-icone><svg viewBox="0 0 24 24" fill=none><rect x=3 y=3 width=8 height=8 rx=1.5 stroke=#7A6A5E stroke-width=2 /><rect x=13 y=3 width=8 height=8 rx=1.5 stroke=#7A6A5E stroke-width=2 /><rect x=3 y=13 width=8 height=8 rx=1.5 stroke=#7A6A5E stroke-width=2 /><rect x=13 y=13 width=8 height=8 rx=1.5 stroke=#7A6A5E stroke-width=2 /></svg></span>
Modelos
</button>
<button onclick=abrirEcraConta()>
<span class=menu-icone><svg viewBox="0 0 24 24" fill=none><rect x=3 y=6 width=18 height=13 rx=2 stroke=#7A6A5E stroke-width=2 /><path d="M3 9h18" stroke=#7A6A5E stroke-width=2 /><circle cx=7 cy=14 r=1.2 fill=#7A6A5E /></svg></span>
A tua conta
</button>
<button onclick=abrirSobre()>
<span class=menu-icone><svg viewBox="0 0 24 24" fill=none><circle cx=12 cy=12 r=9 stroke=#7A6A5E stroke-width=2 /><path d="M12 11v6" stroke=#7A6A5E stroke-width=2 stroke-linecap=round /><circle cx=12 cy=7.5 r=1.1 fill=#7A6A5E /></svg></span>
Sobre
</button>
</div>
</div>
</div>
<div id=folha-overlay>
<div id=folha-caixa>
<div id=folha-cabecalho>
<span id=folha-titulo>BotQL</span>
<button id=btn-fechar-folha onclick=fecharFolha()>
<svg viewBox="0 0 24 24" fill=none><path d="M18 6L6 18M6 6l12 12" stroke=#fff stroke-width=2 stroke-linecap=round /></svg>
</button>
</div>
<div id=folha-corpo></div>
<div id=folha-rodape></div>
</div>
</div>
<div id=modal-overlay>
<div id=modal-caixa>
<div id=modal-cabecalho>BotQL</div>
<div id=modal-corpo></div>
<div id=modal-rodape></div>
</div>
</div>
<div id=teste-overlay>
<div id=teste-statusbar>
<span class=titulo id=teste-titulo>Testar</span>
<button id=btn-fechar-teste onclick=fecharTeste() aria-label=Fechar>
<svg viewBox="0 0 24 24" fill=none><path d="M18 6L6 18M6 6l12 12" stroke=#fff stroke-width=2 stroke-linecap=round /></svg>
</button>
</div>
<div id=teste-chat></div>
<div id=teste-toast></div>
<div id=teste-input-area>
<div class=teste-pv-pill>
<textarea id=teste-input placeholder="Escreve uma mensagem..." autocomplete=off spellcheck=false rows=1 enterkeyhint=enter oninput=ajustarAlturaInputTeste(this)></textarea>
<div class=teste-pv-linha-botoes>
<button class=teste-pv-btn-lateral type=button aria-label=Mais disabled>
<svg viewBox="0 0 24 24" fill=none><path d="M12 5v14M5 12h14" stroke=currentColor stroke-width=2 stroke-linecap=round /></svg>
</button>
<button class=teste-pv-btn-lateral type=button aria-label=Catalogo disabled>
<svg viewBox="0 0 24 24" fill=none><rect x=5 y=8 width=14 height=11 rx=3 stroke=currentColor stroke-width=2 /><path d="M12 2v4" stroke=currentColor stroke-width=2 stroke-linecap=round /><circle cx=12 cy=2 r=1.4 fill=currentColor /><circle cx=9 cy=13.5 r=1.2 fill=currentColor /><circle cx=15 cy=13.5 r=1.2 fill=currentColor /></svg>
</button>
<span class=teste-pv-espaco></span>
<button class=teste-pv-btn-lateral type=button aria-label=Microfone disabled>
<svg viewBox="0 0 24 24" fill=none><rect x=9 y=3 width=6 height=11 rx=3 stroke=currentColor stroke-width=2 /><path d="M5 11a7 7 0 0 0 14 0M12 18v3" stroke=currentColor stroke-width=2 stroke-linecap=round /></svg>
</button>
<button id=btn-enviar-teste onclick=enviarMensagemTeste() aria-label=Enviar>
<svg viewBox="0 0 24 24" fill=none><path d="M12 19V5M6 11l6-6 6 6" stroke=#fff stroke-width=2.4 stroke-linecap=round stroke-linejoin=round /></svg>
</button>
</div>
</div>
</div>
</div>
<script>!function(){function e(){const e=window.visualViewport&&window.visualViewport.height||window.innerHeight;document.documentElement.style.setProperty("--vh",.01*e+"px")}e(),window.visualViewport&&(window.visualViewport.addEventListener("resize",e),window.visualViewport.addEventListener("scroll",e)),window.addEventListener("resize",e)}()</script>
<script src=https://unpkg.com/botql/botql.browser.js></script>
<script src=https://cdn.jsdelivr.net/npm/marked@12/marked.min.js></script>
<script src=https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js></script>
<script src=https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/highlight.min.js></script>
<script src="app.js?v=21"></script>
</body>
</html>
